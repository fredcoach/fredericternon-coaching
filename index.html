            "@type": "Answer",

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La Méthode 3R (Reconnaître, Réagir, Reprogrammer) est un système actionnable qui permet de repérer les déclencheurs de stress, reprendre le contrôle rapidement et installer de nouveaux schémas durables."
          }
        },

          "name": "Combien de temps dure l'accompagnement ?",
          "acceptedAnswer": {

          "@type": "Question",
          "name": "Comment se passe la session CADRAGE ?",
          "acceptedAnswer": {
            "@type": "Answer",

          }
        }
      ]
