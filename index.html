    <!-- FAQ Structured Data (mirrors FAQSection content) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "C'est pour moi ou pas ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pour les dirigeants de PME jusqu'à 30 personnes dont l'entreprise tourne mais repose encore trop sur eux : décisions qui remontent, organisation à plafond, besoin d'un regard extérieur lucide. On vérifie ensemble en 30 min."
          }
        },
        {
          "@type": "Question",
          "name": "Pourquoi maintenant et pas dans 6 mois ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Parce que dans 6 mois, l'entreprise reposera encore plus sur vous. Chaque mois sans recul coûte du temps dirigeant, de la clarté d'organisation et de la croissance."
          }
        },
        {
          "@type": "Question",
          "name": "Je n'ai vraiment pas le temps pour ça.",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Si vous n'avez pas le temps, c'est le symptôme. Les 2 premières semaines posent le diagnostic ; dès la semaine 3-4 vous récupérez du temps grâce à des décisions plus rapides et une délégation réelle."
          }
        },
        {
          "@type": "Question",
          "name": "Comment je sais si ça va marcher pour moi ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vous ne le savez pas avant d'essayer. Côté méthode : regard extérieur, outils concrets, disponibilité entre séances, OS 3R qui reste après. Côté dirigeant : implication, lucidité, engagement. Résultats visibles en 3-4 semaines si vous vous impliquez."
          }
        },
        {
          "@type": "Question",
          "name": "Quel est l'investissement pour cet accompagnement ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "L'accompagnement est sur-mesure : le tarif dépend de la taille de la PME, des objectifs et du niveau d'accompagnement. Il vous est communiqué lors de l'appel de 30 min, une fois le point de blocage identifié."
          }
        },
        {
          "@type": "Question",
          "name": "Combien de temps par semaine je dois y consacrer ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Environ 1h30 à 2h par semaine : 1h de séance, 10 min par jour pour ancrer les routines, et accès à Alpha (pocket coach IA) en cas de besoin. Le rythme s'ajuste à votre semaine de dirigeant."
          }
        },
        {
          "@type": "Question",
          "name": "Mon entreprise tourne déjà bien. Pourquoi j'aurais besoin de ça ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Quand une PME tourne, l'enjeu n'est plus de survivre mais de ne plus dépendre du dirigeant pour tout. Un regard extérieur identifie ce que vous ne pouvez plus voir depuis l'intérieur."
          }
        },
        {
          "@type": "Question",
          "name": "Je suis déjà accompagné (mentor, comité, conseil). C'est compatible ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, totalement. Mentor/comité/conseil traitent stratégie, marché, chiffres. Cet accompagnement traite votre pilotage de dirigeant : décisions, organisation, posture, énergie. Deux rôles complémentaires."
          }
        },
        {
          "@type": "Question",
          "name": "Qu'est-ce qui vous différencie d'un autre coach ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Un regard de terrain (pas du développement personnel), la Méthode 3R appliquée au pilotage, un accompagnement augmenté humain + IA (filet WhatsApp + Alpha 24h/24), et zéro langue de bois : résultats ou on arrête."
          }
        },
        {
          "@type": "Question",
          "name": "Si je veux arrêter en cours de route ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vous pouvez arrêter quand vous voulez. Le deal repose sur l'implication des deux côtés : si l'un décroche, on arrête. Pas de prison, pas de culpabilité."
          }
        },
        {
          "@type": "Question",
          "name": "Concrètement, l'appel de 30 min, ça se passe comment ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "30 min en 3 blocs : diagnostic net de ce qui bloque dans votre pilotage (10 min), identification de la priorité n°1 (10 min), puis vérification du match avec la Méthode 3R (10 min). Zéro vente forcée."
          }
        }
      ]
    }
